<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Explore o Mundo</title>
    <link rel="stylesheet" href="folha_estilo.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <i class="fa-solid fa-earth-americas" class="terra"></i>
            <span class="log">Explore o Mundo</span>
        </div>
        <div class="navegacao">
            <nav class="menu-links">
                <a href="index.html">Início</a>
                <a href="destinos.html">Destinos</a>
                <a href="sobrenos.html">Sobre</a>
                <a href="">Contato</a>
            </nav>
            <div class="redes-sociais">
                <a href="" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="" class="face"><i class="fa-brands fa-facebook"></i></a>
                <a href="" class="insta"><i class="fa-brands fa-instagram"></i></a>
                <a href="" class="twitter"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>
    </header>
    <section class="banner">
        <img src="https://images.unsplash.com/photo-1527095655060-4026c4af2b25?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="imagem de montanhas com um rio-paisagem" class="imagem">

        <div class="texto">
            <h1>Contato</h1>
            <p>Cadastra-se para ter viagens emocionantes!</p>
        </div>
    </section>
    <main class="container">
        <div class="area-cadastro"></div>

            <form action="/processar-cadastro" method="post" class="coluna-form">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite Seu Nome" required minlength="3" maxlength="50"><br><br>

                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite Sua Senha" required minlength="8" maxlength="15"><br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br><br>
                
                <label for="data_nascimento">Telefone:</label>
                <input type="integer" id="telefone"  name="telefone" placeholder="17-99676-7456" required minlength="11"><br><br>

                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" id="data_nasc"  name="data_nascimento" min="1900-01-01"><br><br>

                <label for="nome">Lugar de interesse:</label>
                <input type="text" id="lugar_de_interesse" name="lugar_de_interesse" placeholder="Digite o lugar" required minlength="3" maxlength="100"><br><br>
            </form>
        </div>

    </main>
    <footer class="rodape">
        <p>© 2026 Explore o Mundo - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
